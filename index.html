<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A simple personal expense tracker built with HTML, CSS and JavaScript."
    >

    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="main-header">
        <div class="container">
            <h1>Personal Expense Tracker</h1>
            <p>Track where your money goes.</p>
        </div>
    </header>

    <main class="container">

        <!-- SUMMARY -->
        <section class="summary-grid">

            <article class="summary-card">
                <span class="summary-label">Total spent</span>
                <strong id="totalSpent">€0.00</strong>
            </article>

            <article class="summary-card">
                <span class="summary-label">This month</span>
                <strong id="monthSpent">€0.00</strong>
            </article>

            <article class="summary-card">
                <span class="summary-label">Expenses</span>
                <strong id="expenseCount">0</strong>
            </article>

        </section>


        <!-- ADD / EDIT EXPENSE -->
        <section class="card">

            <h2>Add expense</h2>

            <form id="expenseForm">

                <!--
                    Hidden input used while editing an expense.
                    Empty = new expense.
                    Contains an ID = editing an existing expense.
                -->
                <input
                    type="hidden"
                    id="expenseId"
                >

                <div class="form-grid">

                    <div class="form-group">
                        <label for="description">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            placeholder="e.g. Groceries"
                            maxlength="80"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="amount">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="0.00"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            required
                        >
                            <option value="">
                                Select category
                            </option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >
                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="submitButton"
                        class="button button-primary"
                    >
                        Add expense
                    </button>

                    <button
                        type="button"
                        id="cancelEditButton"
                        class="button button-secondary"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- CHART -->
        <section class="card">

            <h2>Spending by category</h2>

            <div class="chart-wrapper">

                <canvas id="categoryChart"></canvas>

                <p
                    id="chartEmpty"
                    class="empty-message"
                >
                    Add some expenses to see your chart.
                </p>

            </div>

        </section>


        <!-- EXPENSE LIST -->
        <section class="card">

            <div class="section-header">

                <h2>Expenses</h2>

                <div class="filters">

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search expenses..."
                    >

                    <select id="filterCategory">
                        <option value="all">
                            All categories
                        </option>
                    </select>

                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer class="main-footer">
        <div class="container">
            Personal Expense Tracker
        </div>
    </footer>


    <!--
        Chart.js is an external JavaScript library.
        It creates the spending chart.
    -->
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>

    <!--
        type="module" lets app.js import functions
        from other JavaScript files.
    -->
    <script
        type="module"
        src="js/app.js"
    ></script>

</body>
</html>
